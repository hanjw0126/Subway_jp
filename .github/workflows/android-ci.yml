name: Android CI

on:
  push:
    # main + 작업 브랜치 (Auto PR 이 만든 PR 에서는 pull_request 이벤트가 오지 않으므로 push 로 검사)
    branches: [ main, "feat-*", "fix-*", "ui-*", "release-*", "ci-*", "docs-*", "chore-*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit test · Lint · Debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
