name: Deploy ODPT proxy

on:
  push:
    branches: [ main ]
    paths: [ "worker/**", ".github/workflows/deploy-proxy.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          ODPT: ${{ secrets.ODPT_CONSUMER_KEY }}
        run: |
          for v in CF_TOKEN CF_ACCOUNT ODPT; do
            if [ -z "${!v}" ]; then echo "::error::$v 에 해당하는 secret 이 비어 있습니다"; exit 1; fi
          done
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Upload ODPT key as worker secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ODPT_CONSUMER_KEY
          command: deployments list
        env:
          ODPT_CONSUMER_KEY: ${{ secrets.ODPT_CONSUMER_KEY }}
      - name: Smoke test
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          [ -n "$SUB" ] || { echo "::error::workers.dev 하위 도메인을 찾지 못했습니다 (Cloudflare 대시보드 > Workers & Pages 에서 설정)"; exit 1; }
          BASE="https://jp-subway-proxy.$SUB.workers.dev"
          echo "중계 서버: $BASE/api/v4/" >> "$GITHUB_STEP_SUMMARY"
          CODE=000
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' "$BASE/api/v4/odpt:TrainInformation?odpt:railway=odpt.Railway:Toei.Asakusa" || true)
            echo "try $i: HTTP $CODE"; [ "$CODE" = "200" ] && break; sleep 15
          done
          head -c 400 /tmp/r.json; echo
          [ "$CODE" = "200" ] || exit 1
          BLOCK=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/v4/odpt:Station?odpt:operator=odpt.Operator:TokyoMetro")
          echo "허용 외 요청 차단 확인: HTTP $BLOCK"; [ "$BLOCK" = "404" ]
