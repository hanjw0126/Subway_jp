name: Incheon timetable

# 인천교통공사 인천1·2호선 첫차·막차 열차운행시각표(공공데이터포털)를 받아 tools/incheon/raw 에 커밋하고,
# 인천 시간표(재구성)를 만든다. 매달 1일 + 관련 코드가 바뀔 때 + 수동 실행.
on:
  push:
    branches: [main, "feat-*", "fix-*"]
    paths:
      - "tools/incheon/fetch_firstlast.py"
      - "tools/incheon/build_timetable.py"
      - ".github/workflows/incheon-timetable.yml"
  schedule:
    - cron: "30 18 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incheon-timetable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timetable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download first/last timetables
        run: python tools/incheon/fetch_firstlast.py
      - name: Build timetable
        run: '[ -f tools/incheon/build_timetable.py ] && python tools/incheon/build_timetable.py || echo "변환기 없음"'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/incheon/raw app/src/main/assets/regions/seoul
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(incheon): 첫차·막차 시각표·재구성 시간표 갱신 (${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
