name: Quick transfer probe

# 빠른 환승 데이터(한국 국토교통부 CSV, 일본 ODPT StationFacility) 시험 — 보고서와 한국 원본만 커밋
on:
  push:
    branches: ["feat-*", "fix-*"]
    paths:
      - "tools/probe_quick_transfer.py"
      - ".github/workflows/quick-transfer-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-transfer-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          ODPT_CONSUMER_KEY: ${{ secrets.ODPT_CONSUMER_KEY }}
        run: python tools/probe_quick_transfer.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/probe tools/seoul/raw/quick_transfer.csv 2>/dev/null || git add docs/probe
          git commit -m "chore(probe): 빠른 환승 데이터 시험 보고서" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
