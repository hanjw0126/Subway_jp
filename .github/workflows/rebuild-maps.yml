name: Rebuild maps

# tools/ (노선도 생성기·seed) 가 바뀌면 한국어 위키백과 역명을 다시 받고,
# network.json / layout.json 을 다시 만들고 검증한 뒤 커밋한다. 서울 노선도 미리보기(전체·도심)와
# 품질 보고서(docs/images/layout_report.md)도 함께 갱신.
# 검증이 실패해도 결과·보고서·검증 출력(docs/images/validate_log.txt)은 커밋해 원인을 확인할 수 있게 하고,
# 마지막에 실패로 끝낸다.
on:
  push:
    branches: [main, "ui-*", "fix-*", "feat-*"]
    paths:
      - "tools/**"
      - ".github/workflows/rebuild-maps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r tools/requirements.txt pytest
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: Korean Wikipedia station names (Wikidata)
        # 받지 못하면 기존 tools/seed/ko_wiki.json 을 그대로 쓴다
        continue-on-error: true
        run: python tools/ko_wiki.py
      - name: Han river centerline (OpenStreetMap)
        # 한 번 받아 두면 다시 받지 않는다 (갱신하려면 파일을 지우고 실행)
        continue-on-error: true
        run: '[ -f tools/seoul/raw/han_river.json ] || python tools/seoul/fetch_river.py'
      - name: Build network + layout
        run: python tools/build_all.py --no-preview
      - name: Quality report
        continue-on-error: true
        run: python tools/layout_report.py >> "$GITHUB_STEP_SUMMARY"
      - name: Validate
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          { python tools/validate_assets.py && (cd tools && python -m pytest -q -rf --tb=short tests); } 2>&1 | tee "$RUNNER_TEMP/validate.log"
      - name: Seoul preview
        continue-on-error: true
        run: |
          python tools/render_preview.py app/src/main/assets/regions/seoul --out docs/images/map_seoul.png --max-px 3000
          python tools/render_preview.py app/src/main/assets/regions/seoul --out docs/images/map_seoul_center.png \
            --crop 0.22,0.28,0.68,0.62 --max-px 2600
      - name: Commit assets
        # 재생성 도중 브랜치에 새 커밋(앱 코드 등)이 올라와도 그 위에 얹어 올린다
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.validate.outcome }}" != "success" ] && [ -f "$RUNNER_TEMP/validate.log" ]; then
            tail -n 120 "$RUNNER_TEMP/validate.log" > docs/images/validate_log.txt
          else
            rm -f docs/images/validate_log.txt
          fi
          git add -A app/src/main/assets tools/seed tools/seoul/raw docs/images
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          MSG="chore(maps): 노선도·위키백과 역명·미리보기 재생성 (${GITHUB_SHA::7})"
          [ "${{ steps.validate.outcome }}" = "success" ] || MSG="$MSG [검증 실패 — docs/images/validate_log.txt 참고]"
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::재생성 결과를 올리지 못했습니다 (브랜치 충돌)"; exit 1
      - name: Fail if validation failed
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error::검증 실패 — docs/images/validate_log.txt 참고"
          exit 1
