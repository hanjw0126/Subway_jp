name: Release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 0.1.0) — 수동 실행 시 드래프트 릴리즈 생성"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then NAME="${{ github.event.inputs.version }}"; else NAME="${GITHUB_REF_NAME#v}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret 이 없어 debug 키로 서명합니다 (테스트용)."
          fi
      - name: Resolve ODPT proxy URL
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_OVERRIDE: ${{ vars.ODPT_PROXY_URL }}
        run: |
          URL="$PROXY_OVERRIDE"
          if [ -z "$URL" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            SUB=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$SUB" ] && URL="https://jp-subway-proxy.$SUB.workers.dev/api/v4/"
          fi
          if [ -n "$URL" ]; then
            echo "ODPT_PROXY_URL=$URL" >> "$GITHUB_ENV"; echo "중계 서버: $URL"
          else
            echo "::warning::중계 서버 주소를 찾지 못했습니다. 데모/사용자 토큰 모드로 빌드합니다."
          fi
      - name: Build APK / AAB
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease bundleRelease --stacktrace
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/jp-subway-now-${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/jp-subway-now-${{ steps.ver.outputs.name }}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.ver.outputs.name) || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.ver.outputs.name, '-') }}
          generate_release_notes: true
          files: dist/*
