name: Release

# 릴리즈 방법 (셋 중 하나)
#  1) VERSION 파일을 올린 커밋이 main 에 들어오면 → v<VERSION> 태그 + Release 자동 생성
#  2) v*.*.* 태그 push
#  3) 수동 실행(workflow_dispatch) → 드래프트 릴리즈
on:
  push:
    tags: [ "v*.*.*" ]
    branches: [ main ]
    paths: [ "VERSION" ]   # 태그 push 에는 paths 가 적용되지 않는다
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 0.1.0) — 수동 실행 시 드래프트 릴리즈 생성"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(tr -d ' \r\n\t' < VERSION)"
            if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::VERSION 파일 형식이 올바르지 않습니다: '$NAME' (예: 0.4.2)"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$NAME" > /dev/null; then
              echo "::error::v$NAME 태그가 이미 있습니다. VERSION 을 올려 주세요."; exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret 이 없어 debug 키로 서명합니다 (테스트용)."
          fi
      - name: Resolve ODPT proxy URL
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_OVERRIDE: ${{ vars.ODPT_PROXY_URL }}
        run: |
          URL="$PROXY_OVERRIDE"
          if [ -z "$URL" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            SUB=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$SUB" ] && URL="https://jp-subway-proxy.$SUB.workers.dev/api/v4/"
          fi
          if [ -n "$URL" ]; then
            echo "ODPT_PROXY_URL=$URL" >> "$GITHUB_ENV"; echo "중계 서버: $URL"
          else
            echo "::warning::중계 서버 주소를 찾지 못했습니다. 데모/사용자 토큰 모드로 빌드합니다."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Challenge 2026 data (빌드 시에만 주입 · 저장소에 커밋하지 않음)
        env:
          ODPT_C2026_KEY: ${{ secrets.ODPT_C2026_KEY }}
          LAYOUT_REPAIR_BUDGET: "1800"
        run: |
          if [ -z "$ODPT_C2026_KEY" ]; then echo "::warning::ODPT_C2026_KEY 가 없어 챌린지 노선 없이 빌드합니다"; exit 0; fi
          pip install -r tools/requirements.txt
          python tools/c2026/build_seed.py
          python tools/build_all.py --no-preview
          python tools/validate_assets.py
          python tools/c2026/report.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build APK / AAB
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease bundleRelease --stacktrace
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/world-wide-metro-${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/world-wide-metro-${{ steps.ver.outputs.name }}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          # 태그 push 면 그 태그, VERSION/수동 실행이면 v<버전> 태그를 이 커밋에 새로 만든다
          tag_name: ${{ format('v{0}', steps.ver.outputs.name) }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.ver.outputs.name, '-') }}
          generate_release_notes: true
          files: dist/*
