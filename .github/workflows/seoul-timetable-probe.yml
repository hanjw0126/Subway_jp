name: Seoul timetable probe

# 서울교통공사_서울 도시철도 열차운행시각표(공공데이터포털 15098251) 내려받기 시험.
# 결과 보고서(tools/seoul/raw/TIMETABLE_PROBE.md)만 커밋한다.
on:
  push:
    branches: ["feat-*", "fix-*"]
    paths:
      - "tools/seoul/fetch_timetable.py"
      - ".github/workflows/seoul-timetable-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seoul-timetable-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/seoul/fetch_timetable.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/seoul/raw/TIMETABLE_PROBE.md
          git commit -m "chore(seoul): 열차운행시각표 내려받기 시험 보고서" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
