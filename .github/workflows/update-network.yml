name: Update network from ODPT

# 수동 실행: ODPT 에서 노선·역 정보를 다시 받아 seed → network.json → layout.json 을 재생성해 커밋한다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Fetch ODPT → seed
        env:
          ODPT_CONSUMER_KEY: ${{ secrets.ODPT_CONSUMER_KEY }}
        run: python tools/build_seed_from_odpt.py
      - name: Build & validate
        run: |
          python tools/build_all.py --no-preview
          python tools/validate_assets.py
          python -m pytest -q tools/tests
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/seed app/src/main/assets
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: ODPT 노선 데이터 갱신"
          git push
